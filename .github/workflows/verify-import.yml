name: Verify Paperclip Import

on:
  push:
  pull_request:

jobs:
  verify-import:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Paperclip import
        run: npm test
        env:
          CI: "true"
