schema: paperclip/v1
company:
  attachmentMaxBytes: 10485760
  requireBoardApprovalForNewAgents: false
agents:
  ceo:
    adapter:
      type: hermes_local
      config:
        hermesCommand: /usr/local/bin/hermes-paperclip
        provider: openai-codex
        model: gpt-5.6-terra
        extraArgs:
          - --reasoning-effort
          - medium
        persistSession: true
        quiet: true
        timeoutSec: 7200
        graceSec: 20
    runtime:
      heartbeat:
        maxConcurrentRuns: 1
      modelProfiles:
        cheap:
          enabled: true
          label: GPT-5.4 mini
