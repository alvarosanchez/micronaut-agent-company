routines:
  weekly-product-discovery:
    status: active
    triggers:
      - kind: schedule
        label: Weekly Product Discovery
        cronExpression: "0 1 * * 1"
        timezone: Europe/Madrid
  weekly-security-deep-scan:
    status: active
    triggers:
      - kind: schedule
        label: Weekly security deep scan
        cronExpression: "0 1 * * 2"
        timezone: Europe/Madrid
  weekly-user-guide-review:
    status: active
    triggers:
      - kind: schedule
        label: Weekly User Guide Review
        cronExpression: "0 1 * * 3"
        timezone: Europe/Madrid
  weekly-guide-topic-discovery:
    status: active
    triggers:
      - kind: schedule
        label: Weekly Guide Topic Discovery
        cronExpression: "0 1 * * 4"
        timezone: Europe/Madrid
  daily-ceo-self-improvement:
    status: active
    triggers:
      - kind: schedule
        label: Daily CEO Self-Improvement
        cronExpression: "0 3 * * *"
        timezone: Europe/Madrid
  training:
    status: active
    triggers:
      - kind: schedule
        label: Training
        cronExpression: "0 2 */2 * *"
        timezone: Europe/Madrid
tasks:
  verify-imported-company-instance:
    status: todo
    priority: high
