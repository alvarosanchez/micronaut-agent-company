schema: paperclip/v1
schemaVersion: 7
company:
  attachmentMaxBytes: 10485760
  requireBoardApprovalForNewAgents: false
agents:
  ceo:
    adapter:
      type: claude_local
      config:
        engine: auto
        model: claude-opus-5
        effort: medium
        dangerouslySkipPermissions: true
        permissionMode: approve-all
        timeoutSec: 7200
        graceSec: 20
    runtime:
      heartbeat:
        maxConcurrentRuns: 1
  product-manager:
    adapter:
      type: claude_local
      config:
        engine: auto
        model: claude-opus-5
        effort: medium
        dangerouslySkipPermissions: true
