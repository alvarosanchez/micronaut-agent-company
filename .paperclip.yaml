        timeoutSec: 7200
        graceSec: 20
    runtime:
      heartbeat:
        maxConcurrentRuns: 1
  architect:
    adapter:
      type: claude_local
      config:
        engine: auto
        model: claude-fable-5-1
        effort: high
        dangerouslySkipPermissions: true
        permissionMode: approve-all
        timeoutSec: 7200
        graceSec: 20
    runtime:
      heartbeat:
        maxConcurrentRuns: 1
  qa-engineer:
    adapter:
      type: claude_local
      config:
        engine: auto
        model: claude-opus-5
        effort: high
        dangerouslySkipPermissions: true
