schema: paperclip/v1
company:
  attachmentMaxBytes: 10485760
  requireBoardApprovalForNewAgents: false
agents:
  ceo:
    adapter:
      type: codex_local
      config:
        model: gpt-5.5
        modelReasoningEffort: high
        search: true
        dangerouslyBypassApprovalsAndSandbox: true
        extraArgs:
          - --skip-git-repo-check
  product-manager:
    adapter:
      type: codex_local
      config:
        model: gpt-5.5
        modelReasoningEffort: xhigh
        search: true
        dangerouslyBypassApprovalsAndSandbox: true
        extraArgs:
          - --skip-git-repo-check
