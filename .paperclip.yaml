schema: paperclip/v1
company:
  attachmentMaxBytes: 10485760
  requireBoardApprovalForNewAgents: false
agents:
  ceo:
    adapter:
      type: acpx_local
      config:
        mode: persistent
        agent: custom
        agentCommand: /usr/local/bin/hermes -p paperclip acp --accept-hooks
        permissionMode: approve-all
        nonInteractivePermissions: deny
        timeoutSec: 0
        graceSec: 20
        warmHandleIdleMs: 0
    runtime:
      heartbeat:
        maxConcurrentRuns: 1
